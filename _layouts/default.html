<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>try{if(localStorage.getItem('night-vision')==='1')document.documentElement.classList.add('night-vision')}catch(e){}</script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">thephotonbooth<span class="dot">.com</span></a>
      <nav aria-label="Main">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>Astro</a>
        <span class="nav-label">Music</span>
        <span class="nav-label">Landscapes</span>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <button type="button" class="night-toggle" aria-pressed="false" title="Red-light mode">Night mode</button>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <div class="redlight" aria-hidden="true"></div>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}. Built with clear skies and dark frames.</p>
    </div>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script>
    (function () {
      var button = document.querySelector('.night-toggle');
      if (!button) return;
      function sync() { button.setAttribute('aria-pressed', document.documentElement.classList.contains('night-vision') ? 'true' : 'false'); }
      sync();
      button.addEventListener('click', function () {
        document.documentElement.classList.toggle('night-vision');
        try { localStorage.setItem('night-vision', document.documentElement.classList.contains('night-vision') ? '1' : '0'); } catch (e) {}
        sync();
      });
    }());
  </script>
</body>
</html>
