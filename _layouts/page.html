---
layout: default
---
<article class="page container container--narrow">
  <header class="page-header">
    {%- if page.eyebrow %}<p class="eyebrow mono">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
